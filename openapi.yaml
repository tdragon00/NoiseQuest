openapi: 3.1.0

info:
  title: Questboard API
  version: 1.0.0
  summary: REST API for Questboard — an adventure-themed task manager.
  description: |
    Normative API contract for the Questboard Flutter client.

    **This file is the single source of truth for the wire format.** Every response
    carries a worked `example` so the file doubles as the seed dataset and as the
    fixture source for unit and integration tests.

    ### Conventions
    - Base path: `/api/v1` — included in every path below, so the endpoint the
      user types into the Connect screen is just the origin (scheme://host[:port]).
    - Content type: `application/json`
    - Auth: `Authorization: Bearer <access_token>`
    - Timestamps: ISO 8601 UTC, e.g. `2026-10-22T14:03:11Z`
    - IDs: lowercase UUID v4
    - Pagination: `limit` (default 50, max 200) + opaque `cursor`; responses are
      `{ "items": [...], "next_cursor": "..." | null }`
    - Errors: `{ "error": { "code": "...", "message": "...", "field": "..." } }`

    ### Idempotency
    `POST /quests` and `POST /quests/{id}/complete` accept a **client-generated** `id`.
    Replaying the same `id` returns the existing record with `200 OK` instead of
    creating a duplicate. This is what makes the offline outbox safe to retry.

    ### XP model
    - `total_xp` = sum of `xp_awarded` over all of the user's completions.
    - `guild_xp[g]` = sum of `xp_awarded` over completions whose `guild` equals `g`.
      Guild XP is a **subset** of total XP and never affects level or title. A user
      with no-guild completions therefore has `Σ guild_xp < total_xp`.
    - `level` and `title` are **derived** from `total_xp` using the client-side
      default table (`cumXP(L) = 50 × (L − 1) × L`, level cap 50), optionally
      overridden by `GET /meta/levels`.

    ### Seed dataset
    The signed-in user is `Riley_42`: **2,475 total XP → level 7 ("Pulse Weaver")**,
    with 1,250 XP on `Chores` and 1,200 XP on `Work` (the remaining 25 XP comes from
    a completion on a quest with no guild). Other users: `Morgan_88` (3,150 → level 8),
    `Sam_77` (1,450 → level 5), `Ada_01` (900 → level 4), `Quiet_Runner` (420 → level 3).

  contact:
    name: Questboard team
  license:
    name: MIT

servers:
  - url: https://api.questboard.example
    description: |
      Placeholder production server (replace before release). The `/api/v1` prefix
      is part of every path below, so the Connect screen's endpoint field holds
      only the origin (scheme://host[:port]).
  - url: http://127.0.0.1:4010
    description: Local Prism mock server (npx @stoplight/prism-cli mock openapi.yaml -p 4010)

security:
  - bearerAuth: []

tags:
  - name: Meta
    description: Liveness, level configuration, banner presets
  - name: Auth
    description: Registration, login, token refresh, session
  - name: Users
    description: Profile and account management
  - name: Quests
    description: Quest CRUD, lifecycle, and per-viewer state
  - name: Guilds
    description: Derived guild groupings and per-guild XP
  - name: Leaderboard
    description: Global and per-guild rankings

paths:
  /api/v1/health:
    get:
      tags: [Meta]
      summary: Liveness and server version
      description: Used by the Connect screen to validate a typed endpoint.
      security: []
      responses:
        '200':
          description: The server is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                healthy:
                  value:
                    status: ok
                    version: 1.0.0
                    server_time: '2026-10-22T14:03:11Z'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      description: |
        Registers with **email + password only**. `username` and `avatar` are optional.
        When `username` is omitted the server generates and persists a themed
        anonymous `display_name` that remains stable across devices.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              minimal:
                summary: Email and password only
                value:
                  email: riley@example.com
                  password: correct-horse-battery
              withProfile:
                summary: With optional username and avatar
                value:
                  email: riley@example.com
                  password: correct-horse-battery
                  username: Riley_42
                  avatar: ⚔️
      responses:
        '201':
          description: Account created; the client proceeds straight to the main screen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                created:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.payload.signature
                    refresh_token: dG9rZW4tcmVmcmVzaC0xMjM0NTY3
                    token_type: Bearer
                    expires_in: 3600
                    user:
                      id: 3f2b1c44-8a2e-4f3b-9d11-6b0e5a7c1d90
                      email: riley@example.com
                      username: Riley_42
                      display_name: Riley_42
                      avatar: ⚔️
                      banner_preset_id: neon_grid
                      total_xp: 2475
                      created_at: '2026-10-01T09:12:00Z'
                      updated_at: '2026-10-22T13:58:04Z'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              basic:
                value:
                  email: riley@example.com
                  password: correct-horse-battery
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                signedIn:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.payload.signature
                    refresh_token: dG9rZW4tcmVmcmVzaC0xMjM0NTY3
                    token_type: Bearer
                    expires_in: 3600
                    user:
                      id: 3f2b1c44-8a2e-4f3b-9d11-6b0e5a7c1d90
                      email: riley@example.com
                      username: Riley_42
                      display_name: Riley_42
                      avatar: ⚔️
                      banner_preset_id: neon_grid
                      total_xp: 2475
                      created_at: '2026-10-01T09:12:00Z'
                      updated_at: '2026-10-22T13:58:04Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  examples: [dG9rZW4tcmVmcmVzaC0xMjM0NTY3]
      responses:
        '200':
          description: A new access token.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, token_type, expires_in]
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  token_type: { type: string, const: Bearer }
                  expires_in: { type: integer, examples: [3600] }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                me:
                  value:
                    id: 3f2b1c44-8a2e-4f3b-9d11-6b0e5a7c1d90
                    email: riley@example.com
                    username: Riley_42
                    display_name: Riley_42
                    avatar: ⚔️
                    banner_preset_id: neon_grid
                    total_xp: 2475
                    created_at: '2026-10-01T09:12:00Z'
                    updated_at: '2026-10-22T13:58:04Z'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/me:
    patch:
      tags: [Users]
      summary: Update the current user's profile
      description: Update username, avatar, or banner preset. Omitted fields are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: [string, 'null']
                  maxLength: 40
                  description: Set to null to revert to the anonymous display name.
                  examples: ['Riley_42']
                avatar:
                  type: [string, 'null']
                  maxLength: 8
                  description: Emoji glyph, or null for the default sigil.
                  examples: ['⚔️']
                banner_preset_id:
                  type: string
                  enum:
                    - neon_grid
                    - synthwave_sunset
                    - matrix_rain
                    - chrome_canyon
                    - vapor_horizon
                    - pulse_wave
                    - retro_orbit
                    - midnight_pulse
                  examples: [synthwave_sunset]
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                updated:
                  value:
                    id: 3f2b1c44-8a2e-4f3b-9d11-6b0e5a7c1d90
                    email: riley@example.com
                    username: Riley_42
                    display_name: Riley_42
                    avatar: ⚔️
                    banner_preset_id: synthwave_sunset
                    total_xp: 2475
                    created_at: '2026-10-01T09:12:00Z'
                    updated_at: '2026-10-22T14:01:19Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: Delete the current user's account
      description: |
        Requires a typed confirmation phrase. Deletes the account, its quests, and its
        completions. Earned XP is not transferable and is not refunded elsewhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  const: DELETE MY ACCOUNT
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/users/me/password:
    post:
      tags: [Users]
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 8 }
      responses:
        '204':
          description: Password changed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/quests:
    get:
      tags: [Quests]
      summary: List quests
      description: |
        Returns quests visible to the caller, annotated with the caller's **per-viewer**
        state. The same quest may be `available` for one user and `in_progress` for
        another, because any user may work any quest concurrently.

        `status` filters on the caller's own state, not the quest's global state.
      parameters:
        - name: status
          in: query
          description: Filter by the caller's state for the quest.
          schema:
            type: string
            enum: [available, in_progress, completed]
          examples: [available]
        - name: guild
          in: query
          description: Exact guild match, case-insensitive.
          schema: { type: string }
          examples: [Chores]
        - name: q
          in: query
          description: |
            Full-text search across name, description, guild, author name, and icon.
          schema: { type: string }
          examples: [kitchen]
        - name: sort
          in: query
          schema:
            type: string
            enum: [guild, created_at, completed_at, xp_reward, name]
            default: created_at
          examples: [guild]
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: since
          in: query
          description: Delta sync — only records with `updated_at` strictly greater than this timestamp.
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: |
            A page of quests. Every quest carries the caller's own `my_status`, so a
            client can build the Available / In Progress / Completed lists and their
            count badges from one response; the `status` query parameter is an
            optional server-side optimisation.
