                    completed_at: null
                    completed_by_id: null
                    completed_by_name: null
                    completion_count: 0
                    my_status: available
                    my_progress_id: null
                    my_completion_count: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Quests]
      summary: Edit a quest
      description: Only the quest's author may edit it. The author may not change `xp_reward` after any completion has been recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestUpdate'
            examples:
              edit:
                value:
                  name: Clean the kitchen thoroughly
                  description: Wipe the counters, take out the bins, run the dishwasher, mop the floor.
                  icon: 🔌
                  guild: Chores
                  is_repeatable: false
      responses:
        '200':
          description: The updated quest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Quests]
      summary: Delete a quest
      description: |
        Only the quest's author may delete it. Deleting a quest removes it from every
        board but does **not** refund XP already earned from its completions.
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/quests/{questId}/start:
    parameters:
      - $ref: '#/components/parameters/QuestId'
    post:
      tags: [Quests]
      summary: Start (claim) a quest
      description: |
        Moves the quest into the caller's In Progress list. The quest is **not**
        claimed exclusively — other users may start it concurrently, and each gets
        their own `QuestProgress` row.
      responses:
        '201':
          description: The caller's progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestProgress'
              examples:
                started:
                  value:
                    id: 71a2b3c4-5555-4666-8777-88889999aaaa
                    quest_id: a1b2c3d4-1111-4222-9333-444455556666
                    user_id: 3f2b1c44-8a2e-4f3b-9d11-6b0e5a7c1d90
                    status: in_progress
                    started_at: '2026-10-22T14:10:00Z'
                    updated_at: '2026-10-22T14:10:00Z'
                    completed_at: null
        '200':
          description: The caller had already started this quest; the existing progress is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestProgress'
              examples:
                alreadyStarted:
                  value:
                    id: 71a2b3c4-5555-4666-8777-88889999aaaa
                    quest_id: a1b2c3d4-1111-4222-9333-444455556666
                    user_id: 3f2b1c44-8a2e-4f3b-9d11-6b0e5a7c1d90
                    status: in_progress
                    started_at: '2026-10-22T14:10:00Z'
                    updated_at: '2026-10-22T14:10:00Z'
                    completed_at: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/quests/{questId}/complete:
    parameters:
      - $ref: '#/components/parameters/QuestId'
    post:
      tags: [Quests]
      summary: Complete a quest
      description: |
        Records a `QuestCompletion` and awards `xp_reward` to the caller.

        - **Repeatable quest** — resets to `available` immediately and may be completed
          again later, including by the same user.
        - **Non-repeatable quest** — closes globally on the first completion and leaves
          other users' Available lists.

        The body MUST carry a client-generated `id` so an offline completion can be
        retried without double-awarding XP. Replaying the same `id` returns the
        original completion with `200 OK` and no additional XP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  format: uuid
                  description: Client-generated idempotency key.
            examples:
              completion:
                value:
                  id: 0c1d2e3f-1111-4222-9333-444455556666
      responses:
        '201':
          description: Completion recorded and XP awarded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionResult'
              examples:
                completed:
                  summary: Repeating a 50 XP quest — still level 7, no level-up
                  value:
                    completion:
                      id: 0c1d2e3f-1111-4222-9333-444455556666
                      quest_id: a1b2c3d4-1111-4222-9333-444455556666
                      user_id: 3f2b1c44-8a2e-4f3b-9d11-6b0e5a7c1d90
                      guild: Chores
                      xp_awarded: 50
                      completed_at: '2026-10-22T14:12:00Z'
                    xp_awarded: 50
                    total_xp: 2525
                    level: 7
                    title: Pulse Weaver
                    level_up: false
                    quest_status: available
                levelUp:
                  summary: A 500 XP quest that crosses the level 8 threshold
                  value:
                    completion:
                      id: 0f1a2b3c-2222-4333-8444-955566667777
                      quest_id: 1b2c3d4e-2222-4333-8444-955566667777
                      user_id: 3f2b1c44-8a2e-4f3b-9d11-6b0e5a7c1d90
                      guild: Fitness
                      xp_awarded: 500
                      completed_at: '2026-10-22T14:13:00Z'
                    xp_awarded: 500
                    total_xp: 2975
                    level: 8
                    title: Data Drifter
                    level_up: true
                    quest_status: available
        '200':
          description: |
            This completion was already recorded (replayed offline mutation).
            The original result is returned; no additional XP is awarded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionResult'
              examples:
                replayed:
                  value:
                    completion:
                      id: 0c1d2e3f-1111-4222-9333-444455556666
                      quest_id: a1b2c3d4-1111-4222-9333-444455556666
                      user_id: 3f2b1c44-8a2e-4f3b-9d11-6b0e5a7c1d90
                      guild: Chores
                      xp_awarded: 50
                      completed_at: '2026-10-22T14:12:00Z'
                    xp_awarded: 50
                    total_xp: 2525
                    level: 7
                    title: Pulse Weaver
                    level_up: false
                    quest_status: available
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The quest is already closed by another user and is not repeatable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/quests/{questId}/cancel:
    parameters:
      - $ref: '#/components/parameters/QuestId'
    post:
      tags: [Quests]
      summary: Cancel the caller's progress
      description: Returns the quest to the caller's Available list. Only the caller's own progress is affected.
      responses:
        '204':
          description: Cancelled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/guilds:
    get:
      tags: [Guilds]
      summary: Guilds and the caller's XP per guild
      description: |
        Guilds are derived, not entities. A guild exists because some quest carries
        that tag. `guild_xp` is a **subset** of `total_xp` and never affects level.
        Completions on quests with no guild contribute to `total_xp` only, so
        `Σ guild_xp` may be less than `total_xp`.
      responses:
        '200':
          description: The caller's guild breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildBreakdown'
              examples:
                breakdown:
                  value:
                    total_xp: 2475
                    guilds:
                      - name: Chores
                        xp: 1250
                        quest_count: 6
                      - name: Work
                        xp: 1200
                        quest_count: 4
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/leaderboard:
    get:
      tags: [Leaderboard]
      summary: Leaderboard
      description: |
        Ranks users by XP. In `global` scope the ranking key is lifetime `total_xp`;
        in `guild` scope it is the XP earned inside that guild (`xp` on the row).
        `level` and `title` always derive from lifetime `total_xp`, never from the
        scope XP. Each entry carries the fields needed to render the compact banner.
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [global, guild]
            default: global
          examples: [global]
        - name: guild
          in: query
          description: Required when `scope` is `guild`. Case-insensitive.
          schema: { type: string }
          examples: [Work]
        - $ref: '#/components/parameters/Limit'
