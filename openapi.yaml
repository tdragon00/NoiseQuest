    post:
      tags: [Quests]
      summary: Create a quest
      description: |
        Any authenticated user may create a quest. The `id` MUST be a client-generated
        UUID v4 so that an offline create can be retried without duplicating the quest.
        Replaying the same `id` returns the existing quest with `200 OK`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestCreate'
            examples:
                full:
                value:
                  id: 6a7b8c9d-7777-4888-8999-aaaabbbbcccc
                  name: Slay the laundry dragon
                  description: One pile became three. Fold everything, including the socks.
                  icon: 👾
                  quest_type: challenge
                  guild: Chores
                  xp_reward: 75
                  is_repeatable: true
                minimal:
                  summary: Minimal quest with no guild
                  value:
                    id: 7b8c9d0e-8888-4999-8aaa-bbbbccccdddd
                    name: Buy milk
                    quest_type: task
                    xp_reward: 10
      responses:
        '201':
          description: Quest created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
              examples:
                created:
                  value:
                    id: 6a7b8c9d-7777-4888-8999-aaaabbbbcccc
                    name: Slay the laundry dragon
                    quest_type: challenge
                    description: One pile became three. Fold everything, including the socks.
                    icon: 👾
                    guild: Chores
                    xp_reward: 75
                    is_repeatable: true
                    author_id: 3f2b1c44-8a2e-4f3b-9d11-6b0e5a7c1d90
                    author_name: Riley_42
                    status: available
                    created_at: '2026-10-22T14:05:00Z'
                    updated_at: '2026-10-22T14:05:00Z'
                    completed_at: null
                    completed_by_id: null
                    completed_by_name: null
                    completion_count: 0
                    my_status: available
                    my_progress_id: null
                    my_completion_count: 0
        '200':
          description: |
            The quest already exists with this `id` — returned when an offline create
            is retried. The body is identical to the `201` response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
              examples:
                alreadyExists:
                  value:
                    id: 6a7b8c9d-7777-4888-8999-aaaabbbbcccc
