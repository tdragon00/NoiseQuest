  /api/v1/quests/{questId}:
    parameters:
      - $ref: '#/components/parameters/QuestId'
    get:
      tags: [Quests]
      summary: Quest detail
      responses:
        '200':
          description: The quest, annotated with the caller's state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
              examples:
                detail:
                  value:
                    id: a1b2c3d4-1111-4222-9333-444455556666
