components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The `access_token` from `/auth/register` or `/auth/login`.

  parameters:
    QuestId:
      name: questId
      in: path
      required: true
      schema: { type: string, format: uuid }
      examples:
        standard:
          value: a1b2c3d4-1111-4222-9333-444455556666
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from a previous response's `next_cursor`.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing, invalid, or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                error:
                  code: UNAUTHORIZED
                  message: Your session has expired. Please sign in again.
    Forbidden:
      description: Authenticated, but not permitted to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                error:
                  code: FORBIDDEN
                  message: Only the author can change this quest.
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: That quest no longer exists.
    Conflict:
      description: The resource already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflict:
              value:
                error:
                  code: EMAIL_TAKEN
                  message: An account with that email already exists.
    ValidationError:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid:
              value:
                error:
                  code: VALIDATION
                  message: Give the quest an XP reward between 1 and 10000.
                  field: xp_reward

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [VALIDATION]
            message:
              type: string
              examples: [Give the quest an XP reward between 1 and 10000.]
            field:
              type: [string, 'null']
              description: The offending field, when the error is a field-level validation failure.

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        server_time:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        username:
          type: [string, 'null']
          maxLength: 40
          description: Optional. When omitted, the server generates a themed anonymous display name.
        avatar:
          type: [string, 'null']
          maxLength: 8
          description: Optional emoji glyph.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    AuthResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds. }
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, email, display_name, banner_preset_id, total_xp, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username:
          type: [string, 'null']
          description: Null when the user has not chosen one.
        display_name:
          type: string
          description: The name shown in the UI. Equals `username` when set, otherwise a themed anonymous name.
        avatar:
          type: [string, 'null']
          description: Emoji glyph, or null for the default sigil.
        banner_preset_id:
          type: string
          enum:
            - neon_grid
            - synthwave_sunset
            - matrix_rain
            - chrome_canyon
            - vapor_horizon
            - pulse_wave
            - retro_orbit
            - midnight_pulse
        total_xp:
          type: integer
          minimum: 0
          description: Sum of xp_awarded over all of the user's completions. The only input to level.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Quest:
      type: object
      required:
        [id, name, quest_type, xp_reward, is_repeatable, author_id, author_name, status,
         created_at, updated_at, completion_count, my_status, my_completion_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        quest_type:
          type: string
          enum: [task, challenge, raid, event, bounty]
          default: task
          description: Quest category. Guilds are optional for all quest types.
        description:
          type: [string, 'null']
          maxLength: 500
          description: Optional free text. Searched by the `q` parameter.
        icon:
          type: [string, 'null']
          maxLength: 8
          description: Optional emoji glyph from the curated tech/synth set.
        guild:
          type: [string, 'null']
          maxLength: 60
          description: Optional free-text tag. Not an entity. Guilds are optional regardless of quest_type.
        xp_reward: { type: integer, minimum: 1, maximum: 10000 }
        is_repeatable: { type: boolean, default: false }
        author_id: { type: string, format: uuid }
        author_name:
          type: string
          description: Denormalized for display and for search.
        status:
          type: string
          enum: [available, in_progress, completed]
          description: The quest's global status.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at:
          type: [string, 'null']
          format: date-time
          description: Null unless closed (non-repeatable) or on the most recent completion (repeatable).
        completed_by_id: { type: [string, 'null'], format: uuid }
        completed_by_name: { type: [string, 'null'] }
        completion_count:
          type: integer
          minimum: 0
          description: Total completions across all users.
        my_status:
          type: string
          enum: [available, in_progress, completed]
          description: The caller's own state for this quest.
        my_progress_id:
          type: [string, 'null']
          format: uuid
        my_completion_count:
          type: integer
          minimum: 0
          description: How many times the caller completed this quest.

    QuestCreate:
      type: object
      required: [id, name, quest_type, xp_reward]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated. Doubles as the idempotency key.
        name: { type: string, minLength: 1, maxLength: 80 }
        quest_type:
          type: string
          enum: [task, challenge, raid, event, bounty]
          default: task
          description: Quest category. Guilds are optional for all quest types.
        description: { type: [string, 'null'], maxLength: 500 }
        icon: { type: [string, 'null'], maxLength: 8 }
        guild: { type: [string, 'null'], maxLength: 60 }
        xp_reward: { type: integer, minimum: 1, maximum: 10000 }
        is_repeatable: { type: boolean, default: false }

    QuestUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        quest_type:
          type: string
          enum: [task, challenge, raid, event, bounty]
          description: Quest category. Guilds are optional for all quest types.
        description: { type: [string, 'null'], maxLength: 500 }
        icon: { type: [string, 'null'], maxLength: 8 }
        guild: { type: [string, 'null'], maxLength: 60 }
        xp_reward:
          type: integer
          minimum: 1
          maximum: 10000
          description: May not be changed once any completion has been recorded.
        is_repeatable: { type: boolean }

    QuestProgress:
      type: object
      required: [id, quest_id, user_id, status, started_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        quest_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status:
          type: string
          enum: [in_progress, completed]
        started_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }

    QuestCompletion:
      type: object
      required: [id, quest_id, user_id, xp_awarded, completed_at]
      description: |
        Append-only. Never mutated and never deleted. This log is the source of truth
        for both `total_xp` and `guild_xp`.
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated. Doubles as the idempotency key.
        quest_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        guild:
          type: [string, 'null']
          description: Denormalized from the quest at completion time so history survives a rename.
        xp_awarded: { type: integer, minimum: 1 }
        completed_at: { type: string, format: date-time }

    CompletionResult:
      type: object
      required: [completion, xp_awarded, total_xp, level, title, level_up, quest_status]
      properties:
        completion:
          $ref: '#/components/schemas/QuestCompletion'
        xp_awarded:
          type: integer
          description: XP credited by this completion.
        total_xp:
          type: integer
          description: The caller's total XP after this completion.
        level:
          type: integer
          description: Derived level after this completion.
        title:
          type: string
          description: Derived title after this completion.
        level_up:
          type: boolean
          description: True when this completion crossed a level threshold. Drives the level-up sound and animation.
        quest_status:
          type: string
          enum: [available, in_progress, completed]
          description: The quest's status after the completion.

    QuestPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Quest'
        next_cursor:
          type: [string, 'null']

    GuildBreakdown:
      type: object
      required: [total_xp, guilds]
      properties:
        total_xp: { type: integer, minimum: 0 }
        guilds:
          type: array
          items:
            $ref: '#/components/schemas/GuildSummary'

    GuildSummary:
      type: object
      required: [name, xp, quest_count]
      properties:
        name: { type: string }
        xp:
          type: integer
          minimum: 0
          description: XP earned on quests in this guild. Always a subset of total_xp.
        quest_count:
          type: integer
          minimum: 0
          description: Number of quests the caller can see carrying this guild tag.

    LeaderboardEntry:
      type: object
      required: [rank, user_id, display_name, banner_preset_id, total_xp, xp, level, title]
      properties:
        rank: { type: integer, minimum: 1 }
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar: { type: [string, 'null'] }
        banner_preset_id: { type: string }
        total_xp:
          type: integer
          minimum: 0
          description: Lifetime XP. Always the basis for `level` and `title`.
        xp:
          type: integer
          minimum: 0
          description: The XP used for ranking — lifetime XP in global scope, guild XP in guild scope.
        level: { type: integer, minimum: 1 }
        title: { type: string }

    LeaderboardPage:
      type: object
      required: [scope, items]
      properties:
        scope: { type: string, enum: [global, guild] }
        guild: { type: [string, 'null'] }
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        next_cursor: { type: [string, 'null'] }

    LevelConfig:
      type: object
      required: [version, levels]
      description: |
        An override for the client's built-in level curve. If absent or malformed, the
        client uses `cumXP(L) = 50 * (L-1) * L` and the built-in title table.
      properties:
        version:
          type: string
          description: Opaque version string. The client re-fetches when this changes.
        levels:
          type: array
          items:
            $ref: '#/components/schemas/LevelEntry'

    LevelEntry:
      type: object
      required: [level, min_xp, title]
      properties:
        level: { type: integer, minimum: 1 }
        min_xp:
          type: integer
          minimum: 0
          description: Cumulative XP required to reach this level.
        title: { type: string }

    BannerPreset:
      type: object
      required: [id, name, accent, pattern]
      properties:
        id: { type: string }
        name: { type: string }
        accent:
          type: string
          description: Hex colour used for the banner border and glow.
          examples: ['#00E5FF']
        pattern:
          type: string
          description: |
            Procedural pattern key, rendered client-side by a CustomPainter.
            One of: perspective_grid, sunset, rain, canyon, horizon, rings, orbit, sweep.
          examples: [perspective_grid]

    ExportBundle:
      type: object
      required: [exported_at, user, quests, completions]
      properties:
        exported_at: { type: string, format: date-time }
        user:
          $ref: '#/components/schemas/User'
        quests:
          type: array
          items:
            $ref: '#/components/schemas/Quest'
        completions:
          type: array
          items:
            $ref: '#/components/schemas/QuestCompletion'
