name: noisequest
description: "Questboard — a task manager reimagined as an adventure game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  equatable: ^3.0.0
  collection: ^1.19.1
  path_provider: ^2.1.6
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Variable.ttf
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: Share Tech Mono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
